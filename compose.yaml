
services:
  postgres:
    image: postgres:17
    container_name: postgres-spring
    environment:
      POSTGRES_DB: atlas_db
      POSTGRES_USER: ismail
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ismail -d atlas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas_db
      SPRING_DATASOURCE_USERNAME: ismail
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
